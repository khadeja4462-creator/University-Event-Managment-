<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniEvent - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-calendar-event logo-icon"></i>
        <span class="fw-bold">UniEvent</span>
      </a>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="btn btn-orange ms-3" href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <h1 class="display-5 fw-bold">Discover University Events</h1>
      <p class="lead">Workshops, seminars, sports and more — all in one place.</p>
      <form class="hero-search d-flex">
        <input type="text" class="form-control" placeholder="Search events...">
        <button type="submit" class="btn btn-orange">
          <i class="bi bi-search"></i>
        </button>
      </form>
    </div>
  </section>
    <!-- CATEGORIES -->
  <section class="categories">
    <div class="container">
      <div class="row g-3">
        <div class="col-6 col-md-3">
          <div class="category-box">
            <i class="bi bi-tools"></i>
            <p>Workshops</p>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="category-box">
            <i class="bi bi-mic"></i>
            <p>Seminars</p>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="category-box">
            <i class="bi bi-trophy"></i>
            <p>Sports</p>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="category-box">
            <i class="bi bi-mortarboard"></i>
            <p>Graduation</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer mt-5">
    <div class="container text-center">
      <p class="mb-2">© 2026 UniEvent - University Event Management</p>
      <div class="social">
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-twitter-x"></i></a>
      </div>
    </div>
  </footer>

</body>
</html>
